<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>OBS Widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&display=swap">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Manrope',sans-serif}
.wrap{position:fixed;top:20px;left:20px;display:flex;flex-direction:column;align-items:flex-start;gap:0;z-index:10}
.bar{display:flex;align-items:stretch;border-radius:16px 16px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);animation:barIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes barIn{from{transform:translateX(-50px);opacity:0}to{transform:translateX(0);opacity:1}}
.bar-team{display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(12,8,28,.94);min-width:160px;transition:background .4s}
.bar-team.home{border-right:1px solid rgba(255,255,255,.07)}
.bar-team.away{border-left:1px solid rgba(255,255,255,.07)}
.team-logo{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.team-logo img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.team-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:.3px;white-space:nowrap}
.bar-centre{display:flex;align-items:stretch;background:rgba(8,5,20,.97)}
.bar-score{display:flex;align-items:center;justify-content:center;padding:0 22px;font-size:36px;font-weight:900;color:#fff;letter-spacing:4px;min-width:100px;background:linear-gradient(180deg,rgba(108,62,232,.25) 0%,rgba(108,62,232,.05) 100%);border-left:1px solid rgba(108,62,232,.3);border-right:1px solid rgba(108,62,232,.3);transition:color .3s;position:relative}
.bar-score::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(135deg,#6c3ee8,#a855f7)}
.bar-score.pulse{color:#fbbf24;background:linear-gradient(180deg,rgba(245,158,11,.25) 0%,rgba(245,158,11,.05) 100%)}
.bar-timer{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;min-width:80px;background:rgba(108,62,232,.15);border-left:2px solid rgba(108,62,232,.4)}
.bar-timer-val{font-size:18px;font-weight:800;color:#c4b5fd;letter-spacing:1.5px}
.bar-extra{display:none;font-size:12px;font-weight:800;color:#fbbf24;letter-spacing:.5px;margin-top:2px}
.bar-extra.vis{display:block}
.badge{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;border-radius:40px;font-size:15px;font-weight:800;color:#fff;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.4);opacity:0;transform:translateX(-12px) scale(.95);transition:opacity .3s,transform .3s;pointer-events:none;background:linear-gradient(135deg,#6c3ee8,#a855f7)}
.badge.show{opacity:1;transform:translateX(0) scale(1)}
.badge.goal{background:linear-gradient(135deg,#f59e0b,#ef4444);box-shadow:0 8px 28px rgba(239,68,68,.45)}
.badge.yellow{background:linear-gradient(135deg,#d97706,#f59e0b);color:#1a1a2e}
.badge.red{background:linear-gradient(135deg,#dc2626,#991b1b)}
.badge.sub{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
/* Goal animation */
#goalAnim{position:fixed;inset:0;z-index:500;pointer-events:none;display:none;overflow:hidden}
#goalAnim.show{display:block}
.goal-anim-bg{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(251,191,36,.2) 0%,transparent 70%);animation:goalBgPulse .7s ease-in-out 4}
@keyframes goalBgPulse{0%,100%{opacity:0}50%{opacity:1}}
.goal-anim-particles{position:absolute;inset:0}
.goal-anim-text{position:absolute;top:15%;left:50%;text-align:center;transform:translate(-50%,-50%) scale(0);animation:goalTextPop .5s cubic-bezier(.22,1,.36,1) .15s forwards}
@keyframes goalTextPop{0%{transform:translate(-50%,-60%) scale(0) rotate(-8deg);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12) rotate(1deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1}}
.goal-anim-big{font-size:108px;font-weight:900;color:#fbbf24;line-height:1;text-shadow:0 0 60px rgba(251,191,36,.9),0 0 120px rgba(251,191,36,.5),0 8px 20px rgba(0,0,0,.6);letter-spacing:6px}
.goal-anim-sub{font-size:28px;font-weight:800;color:#fff;margin-top:10px;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.confetti-piece{position:absolute;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
/* Overlay */
#overlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;pointer-events:none;display:none;min-width:520px}
#overlay.vis{display:block;animation:ovIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes ovIn{from{transform:translate(-50%,-50%) scale(.88);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.ig-card{background:rgba(8,5,24,.97);backdrop-filter:blur(20px);border-radius:20px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.09)}
.ig-header{background:linear-gradient(135deg,#6c3ee8,#a855f7);padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.ig-title{font-size:14px;font-weight:800;color:#fff;letter-spacing:.6px;text-transform:uppercase}
.ig-match{font-size:12px;font-weight:700;color:rgba(255,255,255,.65)}
.ig-body{padding:18px 22px;display:flex;flex-direction:column;gap:9px}
.ig-stat-row{display:flex;align-items:center;gap:10px}
.ig-val{font-size:18px;font-weight:800;color:#fff;min-width:44px;text-align:right}
.ig-val.away{text-align:left}
.ig-bar-wrap{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;display:flex}
.ig-bar-h{height:100%;background:linear-gradient(90deg,#6c3ee8,#a855f7);transition:width .5s}
.ig-bar-a{height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .5s}
.ig-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.45);min-width:120px;text-align:center}
.ig-squad-grid{display:grid;grid-template-columns:1fr 1fr}
.ig-squad-col{padding:14px 18px}
.ig-squad-col:first-child{border-right:1px solid rgba(255,255,255,.07)}
.ig-squad-col-title{font-size:10px;font-weight:800;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.ig-player{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ig-player:last-child{border-bottom:none}
.ig-pnum{width:22px;height:22px;border-radius:5px;background:rgba(108,62,232,.35);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#a78bfa;flex-shrink:0}
.ig-pname{font-size:12px;font-weight:600;color:#fff}
.ig-single{background:rgba(8,5,24,.97);backdrop-filter:blur(20px);border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);display:flex;align-items:center}
.ig-single-icon{font-size:26px;padding:14px 18px;background:linear-gradient(135deg,#6c3ee8,#a855f7)}
.ig-single-content{padding:10px 18px}
.ig-single-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.6px}
.ig-single-value{font-size:20px;font-weight:800;color:#fff;margin-top:2px}
/* Sponsor logos - top right corner */
#sponsorLogos{position:fixed;top:16px;right:16px;width:200px;height:100px;z-index:50;pointer-events:none}
.sponsor-cycle{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .6s ease-in-out}
.sponsor-cycle.active{opacity:.9}
.sponsor-cycle img{width:100%;height:100%;object-fit:contain}
.status{font-size:10px;font-weight:700;color:rgba(167,139,250,.35);padding-left:2px;transition:all .3s}
.status.ok{color:#4ade80}.status.err{color:#f87171}
/* Penalty Widget */
#penaltyWidget{margin-top:0;display:none;background:rgba(8,5,24,.93);backdrop-filter:blur(10px);overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);width:100%;border-radius:0 0 16px 16px}
#penaltyWidget.vis{display:block;animation:penSlideIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes penSlideIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
.pw-header{background:linear-gradient(135deg,#8b5cf6,#a855f7);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0}
.pw-label{font-size:14px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.8px}
.pw-score{font-size:20px;font-weight:800;color:#fff;letter-spacing:1px}
.pw-body{display:grid;grid-template-columns:1fr 1fr;background:rgba(12,8,28,.97);border-radius:0 0 12px 12px}
.pw-team{padding:14px 24px}
.pw-team:first-child{border-right:1px solid rgba(255,255,255,.1)}
.pw-team-name{font-size:12px;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.pw-shots{display:flex;gap:10px;flex-wrap:wrap}
.pw-shot{width:32px;height:32px;border-radius:50%;border:2.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;transition:all .2s}
.pw-shot.goal{background:#22c55e;border-color:#22c55e;color:#fff}
.pw-shot.miss{background:#ef4444;border-color:#ef4444;color:#fff}
.pw-shot.empty{background:transparent;color:rgba(255,255,255,.2);border-color:rgba(255,255,255,.2)}
.pw-series{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);margin-top:10px}

/* ═══════════════════════════
   АДАПТИВНЫЕ СТИЛИ ДЛЯ ВИДЖЕТА
   ═══════════════════════════ */

/* Планшеты */
@media (max-width: 992px){
  .wrap{top:10px;left:10px}
  
  .bar{border-radius:12px}
  .bar-team{padding:10px 14px;min-width:120px}
  .team-logo{width:28px;height:28px;font-size:14px}
  .team-name{font-size:13px}
  
  .bar-score{font-size:28px;padding:0 16px;min-width:80px}
  .bar-timer{padding:0 12px;min-width:60px}
  .bar-timer-val{font-size:16px}
  .bar-extra{font-size:11px}
  
  .badge{font-size:13px;padding:8px 16px}
  
  /* Пенальти */
  #penaltyWidget{border-radius:0 0 12px 12px}
  .pw-header{padding:10px 20px}
  .pw-label{font-size:12px}
  .pw-score{font-size:16px}
  .pw-team{padding:12px 20px}
  .pw-team-name{font-size:10px}
  .pw-shot{width:26px;height:26px;font-size:12px}
  .pw-series{font-size:10px}
  
  /* Спонсоры */
  #sponsorLogos{top:10px;right:10px;width:150px;height:75px}
  
  /* Оверлей */
  #overlay{min-width:400px}
  .ig-card{min-width:400px}
  .ig-header{padding:12px 20px}
  .ig-title{font-size:12px}
  .ig-match{font-size:11px}
  .ig-body{padding:14px 18px}
  .ig-stat-row{gap:8px}
  .ig-val{font-size:14px;min-width:36px}
  .ig-bar-wrap{height:6px}
  .ig-label{font-size:10px;min-width:100px}
  
  /* Анимация гола */
  .goal-anim-big{font-size:72px}
  .goal-anim-sub{font-size:20px}
}

/* Мобильные телефоны */
@media (max-width: 576px){
  .wrap{top:8px;left:8px;right:8px}
  
  .bar{border-radius:10px;min-width:100%;width:100%}
  .bar-team{padding:8px 10px;min-width:80px}
  .bar-team.home{flex:1}
  .bar-team.away{flex:1}
  .team-logo{width:24px;height:24px;font-size:12px}
  .team-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
  
  .bar-centre{flex-shrink:0}
  .bar-score{font-size:22px;padding:0 12px;min-width:60px;letter-spacing:2px}
  .bar-timer{padding:0 8px;min-width:50px}
  .bar-timer-val{font-size:14px;letter-spacing:1px}
  .bar-extra{font-size:9px;margin-top:1px}
  
  .badge{font-size:11px;padding:6px 12px;border-radius:20px}
  
  /* Пенальти */
  #penaltyWidget{width:100%;border-radius:0 0 10px 10px}
  .pw-header{padding:8px 14px}
  .pw-label{font-size:10px}
  .pw-score{font-size:14px}
  .pw-team{padding:10px 14px}
  .pw-team-name{font-size:9px;margin-bottom:8px}
  .pw-shots{gap:6px}
  .pw-shot{width:20px;height:20px;font-size:10px;border-width:2px}
  .pw-series{font-size:9px;margin-top:8px}
  
  /* Спонсоры */
  #sponsorLogos{top:8px;right:8px;width:120px;height:60px}
  
  /* Оверлей */
  #overlay{min-width:300px;left:10px;right:10px;transform:none}
  .ig-card{min-width:300px;border-radius:14px}
  .ig-header{padding:10px 14px}
  .ig-title{font-size:11px;letter-spacing:.3px}
  .ig-match{font-size:10px}
  .ig-body{padding:12px 14px;gap:8px}
  .ig-stat-row{gap:6px}
  .ig-val{font-size:12px;min-width:28px}
  .ig-bar-wrap{height:4px}
  .ig-label{font-size:9px;min-width:80px}
  
  /* Оверлей статистики */
  .ig-card[style*="min-width:900px"],
  .ig-card[style*="min-width:800px"],
  .ig-card[style*="min-width:1200px"]{min-width:100%!important}
  
  /* Анимация гола */
  .goal-anim-big{font-size:48px}
  .goal-anim-sub{font-size:14px}
  
  /* Статус подключения */
  .status{font-size:8px}
}

/* Очень маленькие экраны */
@media (max-width: 360px){
  .team-name{max-width:60px;font-size:10px}
  .bar-score{font-size:18px;padding:0 10px;min-width:50px}
  .bar-timer-val{font-size:12px}
  .badge{font-size:10px;padding:5px 10px}
  
  .pw-shot{width:18px;height:18px;font-size:9px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-team home" id="wHomeBar">
      <div class="team-logo" id="wHomeLogo"><span>🛡️</span></div>
      <div><span class="team-name" id="wHome">Хозяева</span></div>
    </div>
    <div class="bar-centre">
      <div class="bar-score" id="wScore">0:0</div>
      <div class="bar-timer">
        <span class="bar-timer-val" id="wTime">00:00</span>
        <span class="bar-extra" id="wExtra"></span>
      </div>
    </div>
    <div class="bar-team away" id="wAwayBar">
      <div class="team-logo" id="wAwayLogo"><span>🛡️</span></div>
      <div><span class="team-name" id="wAway">Гости</span></div>
    </div>
  </div>
  <div id="penaltyWidget">
    <div class="pw-header">
      <span class="pw-label">🎯 Пенальти</span>
      <span class="pw-score" id="pwScore">0 — 0</span>
    </div>
    <div class="pw-body">
      <div class="pw-team">
        <div class="pw-team-name" id="pwHomeName">Хозяева</div>
        <div class="pw-shots" id="pwHomeShots"></div>
        <div class="pw-series" id="pwHomeSeries">Серия 1</div>
      </div>
      <div class="pw-team">
        <div class="pw-team-name" id="pwAwayName">Гости</div>
        <div class="pw-shots" id="pwAwayShots"></div>
        <div class="pw-series" id="pwAwaySeries">Серия 1</div>
      </div>
    </div>
  </div>
  <div class="badge" id="badge"></div>
  <div class="status" id="status" style="display:none">⏳ Подключение...</div>
<span id="debug" style="position:fixed;bottom:4px;left:4px;color:#fff;font-size:10px;z-index:999;background:#000;padding:2px 4px"></span>
</div>
<div id="sponsorLogos"></div>

<!-- Goal Animation -->
<div id="goalAnim"><div class="goal-anim-bg"></div><div class="goal-anim-particles" id="goalParticles"></div><div class="goal-anim-text"><div class="goal-anim-big">⚽ ГОЛ!</div><div class="goal-anim-sub" id="goalAnimSub"></div></div></div>

<!-- Overlay for stats/graphics -->
<div id="overlay"><div id="overlayInner"></div></div>

<script>
const ABLY_KEY='GWBiMQ.d3S-Rg:sYnO0tUYfetQakvBTsKL8lBHx_4or6H1K_WR9talGsg';
const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('match');
if (!matchId) {
  document.body.innerHTML = '<div style="color:#ef4444;font-family:Manrope,sans-serif;padding:20px;font-size:14px;font-weight:700">❌ Ошибка: не указан ID матча. Добавьте ?match=ID к URL.</div>';
  throw new Error('Match ID not specified');
}
const ABLY_CHANNEL = 'sb_match_' + matchId;
console.log('Widget init, matchId:', matchId, 'channel:', ABLY_CHANNEL);
let lastBadge='',lastOverlay=null;
let badgeTimer=null,overlayTimer=null,goalTimer=null;
function hexRgba(h,a){try{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}catch{return`rgba(12,8,28,${a})`}}
function setLogo(id,src){const b=document.getElementById(id);if(!b)return;b.innerHTML=src?`<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:7px">`:'<span>🛡️</span>'}
function applyBar(d){
  if(d.home!==undefined)document.getElementById('wHome').textContent=d.home;
  if(d.away!==undefined)document.getElementById('wAway').textContent=d.away;
  if(d.score!==undefined)document.getElementById('wScore').textContent=d.score;
  if(d.time!==undefined)document.getElementById('wTime').textContent=d.time;
  if(d.homeColor)document.getElementById('wHomeBar').style.background=hexRgba(d.homeColor,.92);
  if(d.awayColor)document.getElementById('wAwayBar').style.background=hexRgba(d.awayColor,.92);
  if(d.homeLogo!==undefined)setLogo('wHomeLogo',d.homeLogo);
  if(d.awayLogo!==undefined)setLogo('wAwayLogo',d.awayLogo);
}
function applyBadge(d){
  if(d.badge===undefined||d.badge===lastBadge)return;
  lastBadge=d.badge;
  const b=document.getElementById('badge'),sc=document.getElementById('wScore');
  if(d.badge){
    b.textContent=d.badge;
    
    // Parse team name from badge - format "⚽ ГОЛ! TeamName"
    let teamScorer = '';
    if (d.badge.startsWith('⚽ ГОЛ! ')) {
      teamScorer = d.badge.substring(7).trim();
    }
    
    const t = d.badge.includes('ГОЛ') ? 'goal' : 
             d.badge.includes('Жёлт') ? 'yellow' : 
             d.badge.includes('Красн') ? 'red' : 
             d.badge.includes('Замен') ? 'sub' : '';
    b.className = 'badge show' + (t ? ' ' + t : '');
    if(t == 'goal'){
      sc.classList.add('pulse');setTimeout(()=>sc.classList.remove('pulse'),2500);
      triggerGoalAnim(teamScorer);
    }
    clearTimeout(badgeTimer);badgeTimer=setTimeout(()=>{b.className='badge';lastBadge='';},6000);
  }else{b.className='badge';clearTimeout(badgeTimer);}
}
function triggerGoalAnim(team){
  const el=document.getElementById('goalAnim'),sub=document.getElementById('goalAnimSub'),par=document.getElementById('goalParticles');
  if(!el)return;
  if(sub)sub.textContent=team;
  if(par){
    par.innerHTML='';
    const cols=['#fbbf24','#f59e0b','#ef4444','#a855f7','#6c3ee8','#22c55e','#fff','#fb923c'];
    for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti-piece';const s=6+Math.random()*12;d.style.cssText=`left:${Math.random()*100}%;top:-20px;width:${s}px;height:${s}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${1.8+Math.random()*2.2}s;animation-delay:${Math.random()*.6}s`;par.appendChild(d);}
  }
  el.classList.add('show');clearTimeout(goalTimer);goalTimer=setTimeout(()=>el.classList.remove('show'),4500);
}
function applyOverlay(d){
  const type=d.overlay||null;if(type===lastOverlay)return;lastOverlay=type;
  const ov=document.getElementById('overlay'),inner=document.getElementById('overlayInner');
  clearTimeout(overlayTimer);if(!type){ov.classList.remove('vis');return;}
  const home=d.home||'—',away=d.away||'—',stats=d.stats||{},vis=d.statsVis||{};
  const SD=[{k:'shots',l:'Удары',t:'n'},{k:'shotsOn',l:'Удары (в створ)',t:'n'},{k:'corners',l:'Угловые',t:'n'},{k:'fouls',l:'Фолы',t:'n'},{k:'timeout',l:'Таймауты',t:'n'},{k:'yellowCards',l:'Жёлтые карточки',t:'n'},{k:'redCards',l:'Красные карточки',t:'n'},{k:'possession',l:'Владение мячом',t:'p'},{k:'offsides',l:'Офсайды',t:'n'},{k:'saves',l:'Сейвы',t:'n'},{k:'passes',l:'Передачи',t:'n'},{k:'attacks',l:'Атаки',t:'n'},{k:'dangerous',l:'Опасные атаки',t:'n'},{k:'freekicks',l:'Штрафные',t:'n'}];
  let html='';
if(type==='stats'){
    const rows=SD.filter(s=>vis[s.k]).map(s=>{const sd=stats[s.k]||{h:0,a:0};if(s.t==='p'){const h=sd.h||0,a=sd.a||0;return`<div class="ig-stat-row" style="gap:16px"><span style="font-size:28px;font-weight:800;color:#fff;min-width:60px;text-align:right">${h}%</span><div class="ig-bar-wrap" style="height:14px"><div class="ig-bar-h" style="width:${h}%"></div><div class="ig-bar-a" style="width:${a}%"></div></div><span class="ig-label" style="font-size:16px;min-width:180px">${s.l}</span><div class="ig-bar-wrap" style="height:14px"><div class="ig-bar-h" style="width:${a}%"></div></div><span class="ig-val away" style="font-size:28px;min-width:60px">${a}%</span></div>`;}const tot=((sd.h||0)+(sd.a||0))||1,hw=Math.round((sd.h||0)/tot*100),aw=100-hw;return`<div class="ig-stat-row" style="gap:16px"><span style="font-size:28px;font-weight:800;color:#fff;min-width:60px;text-align:right">${sd.h||0}</span><div class="ig-bar-wrap" style="height:14px"><div class="ig-bar-h" style="width:${hw}%"></div><div class="ig-bar-a" style="width:${aw}%"></div></div><span class="ig-label" style="font-size:16px;min-width:180px">${s.l}</span><div class="ig-bar-wrap" style="height:14px"><div class="ig-bar-h" style="width:${aw}%"></div></div><span class="ig-val away" style="font-size:28px;min-width:60px">${sd.a||0}</span></div>`;}).join('');
    html=`<div class="ig-card" style="min-width:900px">
      <div class="ig-header" style="background:linear-gradient(135deg,#6c3ee8,#a855f7);padding:16px 32px">

        <span class="ig-match" style="font-size:16px">${home} — ${away}</span>
      </div>
      <div class="ig-body" style="padding:24px 32px">${rows||'<div style="color:rgba(255,255,255,.3);padding:12px;font-size:18px">Нет данных</div>'}</div>
    </div>`;
}else if(['shots','shots-on','corners','possession','red-cards','yellow-cards','fouls','timeout'].includes(type)){
    const km={shots:'shots','shots-on':'shotsOn',corners:'corners',possession:'possession','red-cards':'redCards','yellow-cards':'yellowCards',fouls:'fouls',timeout:'timeout'};
    const im={shots:'⚽','shots-on':'🎯',corners:'🚩',possession:'🔵','red-cards':'🟥','yellow-cards':'🟨',fouls:'⚠️',timeout:'⏱'};
    const lm={shots:'Удары','shots-on':'Удары в створ',corners:'Угловые',possession:'Владение мячом','red-cards':'Красные карточки','yellow-cards':'Жёлтые карточки',fouls:'Фолы',timeout:'Таймауты'};
    const key=km[type],sd=stats[key]||{h:0,a:0},ip=key==='possession';
    const vH=ip?(sd.h||0)+'%':(sd.h||0),vA=ip?(sd.a||0)+'%':(sd.a||0),tot=ip?100:((sd.h||0)+(sd.a||0))||1,hw=ip?(sd.h||0):Math.round((sd.h||0)/tot*100),aw=100-hw;
    html=`<div class="ig-card" style="min-width:800px">
      <div class="ig-header" style="background:linear-gradient(135deg,#6c3ee8,#a855f7);padding:16px 32px">
        <span class="ig-title" style="font-size:20px">${im[type]} ${lm[type]}</span>
        <span class="ig-match" style="font-size:16px">${home} — ${away}</span>
      </div>
      <div class="ig-body" style="padding:32px 40px">
        <div class="ig-stat-row" style="gap:24px">
          <span style="font-size:48px;font-weight:800;color:#fff;min-width:100px;text-align:right">${vH}</span>
          <div style="flex:1;height:20px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;display:flex">
            <div style="height:100%;background:linear-gradient(90deg,#6c3ee8,#a855f7);width:${hw}%;transition:width .5s"></div>
            <div style="height:100%;background:linear-gradient(90deg,#10b981,#34d399);width:${aw}%;transition:width .5s"></div>
          </div>
          <span style="font-size:48px;font-weight:800;color:#fff;min-width:100px">${vA}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 4px">
          <span style="font-size:20px;font-weight:700;color:rgba(255,255,255,.6)">${home}</span>
          <span style="font-size:20px;font-weight:700;color:rgba(255,255,255,.6)">${away}</span>
        </div>
      </div>
    </div>`;
  }else if(type==='preview'){
    const hL=d.homeLogo?`<img src="${d.homeLogo}" style="width:140px;height:140px;border-radius:24px;object-fit:cover;margin-bottom:16px">`:'<div style="font-size:84px;margin-bottom:16px">🛡️</div>';
    const aL=d.awayLogo?`<img src="${d.awayLogo}" style="width:140px;height:140px;border-radius:24px;object-fit:cover;margin-bottom:16px">`:'<div style="font-size:84px;margin-bottom:16px">🛡️</div>';
    html=`<div class="ig-card" style="min-width:800px">
      <div class="ig-header" style="background:linear-gradient(135deg,#6c3ee8,#a855f7);padding:18px 36px">
        <span class="ig-title" style="font-size:20px">🏟 Превью матча</span>
      </div>
      <div class="ig-body" style="align-items:center;padding:48px 56px">
        <div style="display:flex;align-items:center;gap:48px;justify-content:center">
          <div style="text-align:center">${hL}<div style="font-size:56px;font-weight:800;color:#fff">${home}</div><div style="font-size:22px;color:rgba(255,255,255,.4);margin-top:8px">Хозяева</div></div>
          <div style="font-size:48px;font-weight:800;color:rgba(255,255,255,.2);padding:0 24px">VS</div>
          <div style="text-align:center">${aL}<div style="font-size:56px;font-weight:800;color:#fff">${away}</div><div style="font-size:22px;color:rgba(255,255,255,.4);margin-top:8px">Гости</div></div>
        </div>
      </div>
    </div>`;
  }else if(type==='intro'){
    const stadium = d.stadium || 'Стадион';
    const matchName = d.name || 'Матч';
    const sponsorLogos = (_sponsorImgs||[]).slice(0, 6).map(s => `<img src="${s}" style="height:60px;max-width:150px;object-fit:contain;opacity:.85">`).join('') || '<span style="font-size:18px;color:rgba(255,255,255,.4)">Партнёры</span>';
    const hL=d.homeLogo?`<img src="${d.homeLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:23px">`:'<span style="font-size:72px">🏃</span>';
    const aL=d.awayLogo?`<img src="${d.awayLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:23px">`:'<span style="font-size:72px">🏃</span>';
    html=`<div class="ig-card" style="min-width:1200px;background:rgba(8,5,24,.92)">
      <div class="ig-header" style="background:linear-gradient(135deg,#6c3ee8,#a855f7);padding:20px 40px">
        <span class="ig-title" style="font-size:22px">${matchName}</span>
        <span class="ig-match" style="color:rgba(255,255,255,.7);font-size:16px">🏟 ${stadium}</span>
      </div>
      <div class="ig-body" style="align-items:center;padding:48px 60px;gap:40px">
        <div style="display:flex;align-items:center;gap:60px;justify-content:center">
          <div style="text-align:center">
            <div style="width:160px;height:160px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden">
              ${hL}
            </div>
            <div style="font-size:42px;font-weight:800;color:#fff">${home}</div>
            <div style="font-size:18px;color:rgba(255,255,255,.4);margin-top:6px">Хозяева</div>
          </div>
          <div style="font-size:48px;font-weight:800;color:rgba(255,255,255,.2);padding:0 40px">—</div>
           <div style="text-align:center">
             <div style="width:160px;height:160px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden">
               ${aL}
             </div>
             <div style="font-size:42px;font-weight:800;color:#fff">${away}</div>
             <div style="font-size:18px;color:rgba(255,255,255,.4);margin-top:6px">Гости</div>
           </div>
         </div>
       </div>

       <!-- Referees and Commentators -->
       ${(() => {
         const refs = d.refs || [];
         const comms = d.commentators || [];
         const hasRefs = refs.length > 0;
         const hasComms = comms.length > 0;
         
         if (!hasRefs && !hasComms) return '';
         
         const refsHtml = hasRefs ? refs.map(r => 
           `<div style="display:flex;gap:12px;padding:6px 0"><span style="font-weight:700;color:rgba(255,255,255,.5);min-width:160px;font-size:14px">${r.role}</span><span style="font-weight:600;color:#fff;font-size:15px">${r.name}</span></div>`
         ).join('') : '';
         
         const commsHtml = hasComms ? comms.map(c => 
           `<div style="display:flex;gap:12px;padding:6px 0"><span style="font-weight:700;color:rgba(255,255,255,.5);min-width:160px;font-size:14px">${c.role}</span><span style="font-weight:600;color:#fff;font-size:15px">${c.name}</span></div>`
         ).join('') : '';
         
         let content = '';
         if (hasRefs) {
           content += `<div style="text-align:center">
             <div style="font-size:18px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:12px;letter-spacing:1px">🧑‍⚖️ СУДЕЙСКАЯ БРИГАДА</div>
             <div style="display:inline-block;text-align:left">${refsHtml}</div>
           </div>`;
         }
         if (hasRefs && hasComms) {
           content += `<div style="width:2px;height:80px;background:rgba(255,255,255,.1)"></div>`;
         }
         if (hasComms) {
           content += `<div style="text-align:center">
             <div style="font-size:18px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:12px;letter-spacing:1px">🎙 КОММЕНТАТОРЫ</div>
             <div style="display:inline-block;text-align:left">${commsHtml}</div>
           </div>`;
         }
         
         return `<div style="display:flex;align-items:flex-start;justify-content:center;gap:60px;padding:20px 40px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)">
           ${content}
         </div>`;
       })()}

       <div style="background:rgba(255,255,255,.04);padding:20px 40px;display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.06)">

        ${sponsorLogos}
      </div>
    </div>`;
   }else if(type==='referee'){
     const refs = d.refs || [];
     const list = refs.length
       ? refs.map(r => `<div style="display:flex;gap:8px;padding:4px 0"><span style="font-weight:700;color:rgba(255,255,255,.5);min-width:140px">${r.role}</span><span style="font-weight:600;color:#fff">${r.name}</span></div>`).join('')
       : '<div style="color:rgba(255,255,255,.4);padding:4px 0;font-style:italic">Не указаны</div>';
     html=`<div class="ig-single" style="min-width:380px">
       <div class="ig-single-icon">🧑‍⚖️</div>
       <div class="ig-single-content">
         <div class="ig-single-label">Арбитры</div>
         <div style="margin-top:4px">${list}</div>
       </div>
     </div>`;
   }else if(type==='commentators'){
     const comms = d.commentators || [];
     const list = comms.length
       ? comms.map(c => `<div style="display:flex;gap:8px;padding:4px 0"><span style="font-weight:700;color:rgba(255,255,255,.5);min-width:140px">${c.role}</span><span style="font-weight:600;color:#fff">${c.name}</span></div>`).join('')
       : '<div style="color:rgba(255,255,255,.4);padding:4px 0;font-style:italic">Не указаны</div>';

       <div class="ig-single-icon">🎙</div>

}
let _sponsorImgs=[],_sponsorIdx=0,_sponsorTimer=null;
function _applySponsorLogos(){
  const logosEl=document.getElementById('sponsorLogos');
  if(!logosEl)return;
  const imgs=_sponsorImgs.filter(Boolean);
  const curSrc=[...logosEl.querySelectorAll('.sponsor-cycle img')].map(el=>el.src);
  if(imgs.length===curSrc.length&&imgs.every((s,i)=>s===curSrc[i]))return;
  clearTimeout(_sponsorTimer);_sponsorTimer=null;
  if(imgs.length){
    logosEl.innerHTML=imgs.map(s=>`<div class="sponsor-cycle"><img src="${s}" alt=""></div>`).join('');
    void logosEl.offsetHeight;
    logosEl.querySelector('.sponsor-cycle')?.classList.add('active');
    _sponsorIdx=0;
    if(imgs.length>1)_cycleSponsors();
  }else{
    logosEl.innerHTML='';
  }
}
function _cycleSponsors(){
  if(!_sponsorImgs.length)return;
  const all=document.querySelectorAll('.sponsor-cycle');
  all.forEach((el,i)=>el.classList.toggle('active',i===_sponsorIdx));
  _sponsorIdx=(_sponsorIdx+1)%_sponsorImgs.length;
  _sponsorTimer=setTimeout(_cycleSponsors,20000);
}
function apply(d){applyBar(d);applyBadge(d);applyOverlay(d);applyPenalty(d);}
function applyPenalty(d){
  const pw=document.getElementById('penaltyWidget');
  if(!pw)return;
  const pen=d.penalty;
  if(!pen||!pen.active){
    pw.classList.remove('vis');
    return;
  }
  if(d.home)document.getElementById('pwHomeName').textContent=d.home;
  if(d.away)document.getElementById('pwAwayName').textContent=d.away;
  const hGoals=pen.home?pen.home.filter(s=>s==='goal').length:0;
  const aGoals=pen.away?pen.away.filter(s=>s==='goal').length:0;
  document.getElementById('pwScore').textContent=hGoals+' — '+aGoals;
  document.getElementById('pwHomeSeries').textContent='Серия '+(pen.series||1);
  document.getElementById('pwAwaySeries').textContent='Серия '+(pen.series||1);
  const maxShots=5;
  const hShots=document.getElementById('pwHomeShots');
  const aShots=document.getElementById('pwAwayShots');
  hShots.innerHTML='';aShots.innerHTML='';
  for(let i=0;i<maxShots;i++){
    const hs=pen.home||[];
    const as=pen.away||[];
    hShots.innerHTML+=`<div class="pw-shot ${hs[i]==='goal'?'goal':hs[i]==='miss'?'miss':'empty'}">${hs[i]==='goal'?'✓':hs[i]==='miss'?'✗':''}</div>`;
    aShots.innerHTML+=`<div class="pw-shot ${as[i]==='goal'?'goal':as[i]==='miss'?'miss':'empty'}">${as[i]==='goal'?'✓':as[i]==='miss'?'✗':''}</div>`;
  }
  pw.classList.add('vis');
}
const statusEl=document.getElementById('status');
let _sponsorAccum = []; // accumulate sponsor items
function initAbly(){
  if(!window.Ably){setTimeout(initAbly,500);return;}
  statusEl.textContent='🟡 Подключение...';
  statusEl.className='status';
  const ably=new Ably.Realtime({key:ABLY_KEY,clientId:'widget'});
  ably.connection.on('connected',()=>{
    statusEl.textContent='🟢 Матч ' + (matchId || 'не выбран') + ' · ' + ABLY_CHANNEL;
    statusEl.className='status ok';
    const ch = ably.channels.get(ABLY_CHANNEL);
    ch.subscribe('update',msg=>{
      console.log('Widget received:', msg.data);
      if(msg.data)apply(msg.data);
      if(msg.data && msg.data.overlay){
        console.log('Overlay type:', msg.data.overlay);
      }
    });
    // Reset sponsor accumulator before new batch
    ch.subscribe('sponsor-reset', () => { _sponsorAccum = []; });
    // Receive sponsors one at a time (Ably 65KB limit)
    ch.subscribe('sponsor-item', msg => {
      const item = msg.data;
      if (!item) return;
      _sponsorAccum[item.index] = item.data;
      if (_sponsorAccum.filter(Boolean).length >= item.total) {
        _sponsorImgs = _sponsorAccum.filter(Boolean);
        _sponsorAccum = [];
        // Re-render sponsors
        _applySponsorLogos();
      }
    });
    // Request sponsors once on connect (scoreboard pushes on changes)
    ch.publish('requestSponsors', {ask: 1}).catch(()=>{});
  });
  ably.connection.on('failed',()=>{statusEl.textContent='🔴 Нет связи';statusEl.className='status err';});
  ably.connection.on('disconnected',()=>{statusEl.textContent='🟡 Переподключение';statusEl.className='status';});
}
initAbly();
</script>
